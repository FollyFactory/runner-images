# gha-runner-scale-set values for ghcr.io/follyfactory/runner-images/ubuntu2404.
#
#   helm upgrade --install mortis-farm-cur10 \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --namespace arc-runners --create-namespace \
#     --values arc-values.yaml
#
# Corrected from the working copy on 27 Oct 2026. Three fixes, each checked
# against the chart source rather than the docs:
#   1. the runner container must be named `runner`
#   2. the Helm value for labels is `scaleSetLabels`, not `runnerScaleSetLabels`
#   3. `command:` is unnecessary here, and setting it skips the image entrypoint
# See the ARC scale set section of ../README.md for the reasoning.

# Where the runners register. Org, repo or enterprise URL.
githubConfigUrl: https://github.com/FollyFactory

# Name of a Secret you create yourself, holding either github_token (PAT) or
# github_app_id / github_app_installation_id / github_app_private_key.
githubConfigSecret: mortis-farm-cur10-github

# What `runs-on:` names in a workflow, and the only label the scale set answers
# to unless scaleSetLabels below is picked up. Defaults to the Helm release name.
# A job asks for it by this exact string: `runs-on: mortis-farm-cur10`. It cannot
# be combined with `self-hosted` or any other label in the same runs-on.
runnerScaleSetName: mortis-farm-cur10

# Two idle pods keep the ~6GB image warm in the node's cache, so a job starts
# without waiting on a pull.
minRunners: 2
maxRunners: 4

# dind, because the shared workflows shell out to docker: `docker run postgres:18`
# in dotnet-build-test, rhysd/actionlint in tests, and docker build/push in the
# release workflows. The sidecar shares the pod's network, so a container started
# with --publish 5432:5432 is reachable on localhost from the job.
containerMode:
  type: dind

# CHANGED: was `runnerScaleSetLabels`, which is the name of the field on the
# AutoscalingRunnerSet CR, not of the Helm value that fills it. The chart's
# values.schema.json only validates listenerConfig, so the wrong key is accepted
# and silently dropped - the scale set would advertise no labels at all.
scaleSetLabels:
  - self-hosted
  - linux
  - dotnet
  - node

template:
  spec:
    # Only needed while the package is private. Delete once its visibility is
    # public, and the nodes pull anonymously.
    # imagePullSecrets:
    #   - name: ghcr-pull

    containers:
      # CHANGED: was `cur10-runner`. The name is load-bearing, not cosmetic.
      # autoscalingrunnerset.yaml hardcodes `- name: runner` and fills its body
      # from the values container of that exact name, and both the dind wiring
      # (DOCKER_HOST, the work volume, the externals mount) and the
      # init-dind-externals container are gated on the same check. Under any
      # other name the rendered runner container has no image, and yours is
      # left as a stray sidecar with no job config.
      - name: runner
        image: ghcr.io/follyfactory/runner-images/ubuntu2404:latest

        # REMOVED: command: ["/home/runner/run.sh"]
        # Kubernetes `command` replaces the image's ENTRYPOINT, not its CMD.
        # This image's entrypoint handles START_POSTGRES and then execs run.sh,
        # so setting command skips it. Left alone, the image runs run.sh anyway.
        # To keep both, use:
        #   command: ["/usr/local/bin/entrypoint.sh", "/home/runner/run.sh"]

        # Requests are what the scheduler must find on one node, for every
        # runner pod at once. Set them above what a node can spare and the pods
        # sit Pending forever - no pull, no error, no job. These are deliberately
        # modest; raise them only against what
        #   kubectl get nodes -o custom-columns=\
        #     NAME:.metadata.name,CPU:.status.allocatable.cpu,\
        #     MEM:.status.allocatable.memory,EPH:.status.allocatable.ephemeral-storage
        # says a node actually has, remembering minRunners pods are always up.
        #
        # No ephemeral-storage request on purpose: allocatable ephemeral storage
        # is often far smaller than the disk, and it is the quietest way to make
        # a pod unschedulable. Add one only if you hit eviction under disk
        # pressure, and size it from that node's allocatable figure.
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
